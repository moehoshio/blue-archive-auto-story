# Blue Archive Auto Story — configuration

adb:
  path: adb          # Path to the adb executable; use a full path if adb is not in PATH
  serial: null       # Device serial to use; null = the only connected device (check: adb devices)

matching:
  # The screen resolution may differ from the asset capture resolution,
  # so templates are matched at multiple scales.
  scale_min: 0.65    # Minimum scale to try; real UI elements are always well above this floor
  scale_max: 1.6     # Maximum scale; native element scale on this device is ~1.0-1.16; >1.6 wastes time
  scale_steps: 17
  default_threshold: 0.75
  # After a successful match, cache the winning scale and search near it first on subsequent ticks.
  scale_cache_tolerance: 0.08
  # Resize the screen to this width before matching (0 = no resize).
  # 960px gives ~4x speedup; combined with coarse-to-fine scale refinement,
  # even narrow text banners like "All Episodes cleared." still match reliably (~0.80).
  proc_width: 960

loop:
  tick_interval: 1.0   # Seconds between screen checks; flow changes are handled by grace ticks, not a shorter interval
  tap_delay: 0.5       # Seconds to wait after each tap for animations to settle
  idle_ticks_to_end: 30  # Consecutive ticks with no match → declare stuck / done
  transition_grace_ticks: 8  # Grace ticks after a state transition; blank frames don't count as failures during this window

combat:
  desired_speed: 3     # Target battle speed multiplier (2 or 3)

network:
  max_reconnect: 10    # Max reconnect button taps; exceeding this stops the tool and asks for manual help

# MomoTalk (--momotalk mode) settings.
# Coordinates are absolute values at reference resolution 1920x1080 and are scaled linearly to
# the actual screen at runtime. The popup layout is fixed, so these rarely need adjustment;
# only tweak if taps land in the wrong place on your device/resolution.
momotalk:
  idle_switch_ticks: 5   # Ticks of conversation inactivity (not "typing…") → treat as done, switch to next unread
  max_switches: 5        # Max switches across visible rows before closing and reopening MomoTalk to refresh the list
  grace_ticks: 10        # Grace ticks after entering a story or reward screen (covers loading gaps)
  done_confirm_ticks: 6  # Consecutive ticks with no unread badge before declaring the task done (avoids false positive during reward/transition)
  tick_interval: 1.0     # Seconds between screen checks
  tap_delay: 0.6         # Seconds to wait after each tap

  # Coordinate tuning (reference resolution 1920x1080; scaled at runtime).
  # Adjust these if taps land in the wrong place on your device.

  # MomoTalk entry = Notice (speaker icon) center + this offset.
  # This is the most likely value to need adjustment when changing device/resolution.
  notice_home_offset: [142, 10]

  close_xy: [1681, 177]        # Close button (X) for the MomoTalk popup
  unread_tab_xy: [255, 430]    # "Unread" tab (chat bubble icon on the left) after reopening
  first_row_xy: [450, 400]     # Center of the topmost conversation row in the unread list
  row_height: 105              # Height of each conversation row
  reply_label_offset: [200, 85]  # Offset from the "| Reply" label to the first reply option

  # Other coordinates (reward_dismiss_xy, story_enter_*, home_badge_rel, etc.)
  # are in src/config.py — MomoTalkConfig — and can be overridden here with the same key names.

assets_dir: assets
log_level: INFO
save_debug_screens: false   # Set to true to save every tick's screenshot to debug/ for troubleshooting
